name: Autonomous AI Learning Loop

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to manually trigger the loop using a button on GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the container absolute write/commit permission access
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Set up cloud Python system
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Advanced Math Libraries
        run: |
          python -m pip install --upgrade pip
          pip install sympy requests

      - name: Execute Autonomous Math Compiler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Explicitly maps the token for python access
        run: python bot.py
