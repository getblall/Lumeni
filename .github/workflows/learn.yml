name: Autonomous AI Learning Loop

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Set up cloud Python system
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Advanced Math Libraries
        run: |
          python -m pip install --upgrade pip
          pip install sympy requests

      - name: Execute Autonomous Math Compiler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: python engine.py  # 👈 CHANGED FROM bot.py TO engine.py
